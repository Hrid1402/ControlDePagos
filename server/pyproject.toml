[project]
name = "control-de-pagos-server"
version = "0.1.0"
description = "API del sistema de control de pagos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.114",
    "celery[redis]>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
ocr = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pdf2image>=1.17.0",
]
robots = [
    "playwright>=1.64.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["app"]
