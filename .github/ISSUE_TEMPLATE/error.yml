name: Reportar un error
description: Algo no funciona como dice la especificación
title: "error: "
labels: ["error"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - client
        - server
        - ambos
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia o tarea relacionada
      placeholder: H24 o TASK-85
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ingresar como asistente
        2. Abrir una deuda pendiente
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o registros
